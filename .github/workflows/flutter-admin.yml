name: Flutter Admin CI

on:
  push:
    branches: [feature/flutter-admin-app, main]
    paths:
      - 'flutter_admin/**'
      - '.github/workflows/flutter-admin.yml'
  pull_request:
    paths:
      - 'flutter_admin/**'
      - '.github/workflows/flutter-admin.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name apex_studio_admin --org com.apexstudio .
      - name: Enable Android core library desugaring for notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text()
          if "isCoreLibraryDesugaringEnabled = true" not in source:
              source, count = re.subn(
                  r"compileOptions\\s*\\{",
                  "compileOptions {\\n        isCoreLibraryDesugaringEnabled = true",
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not find Android compileOptions block")
          if "coreLibraryDesugaring(" not in source:
              source += '\\ndependencies {\\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\\n}\\n'
          gradle.write_text(source)
          PY
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-studio-admin-debug-apk
          path: flutter_admin/build/app/outputs/flutter-apk/app-debug.apk
