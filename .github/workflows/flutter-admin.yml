name: Flutter Admin CI

on:
  push:
    branches: [feature/flutter-admin-app, main]
    paths:
      - 'flutter_admin/**'
      - '.github/workflows/flutter-admin.yml'
  pull_request:
    paths:
      - 'flutter_admin/**'
      - '.github/workflows/flutter-admin.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name apex_studio_admin --org com.apexstudio .
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-studio-admin-release-apk
          path: flutter_admin/build/app/outputs/flutter-apk/app-release.apk
