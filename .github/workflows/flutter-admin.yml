name: Flutter Admin CI

on:
  push:
    branches: [feature/flutter-admin-app, main]
    paths:
      - 'flutter_admin/**'
      - '.github/workflows/flutter-admin.yml'
  pull_request:
    paths:
      - 'flutter_admin/**'
      - '.github/workflows/flutter-admin.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          echo "ANALYZE_EXIT_CODE=$status" >> analyze.log
          exit $status
      - name: Upload analyzer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-studio-admin-analyzer-log
          path: flutter_admin/analyze.log
          if-no-files-found: ignore
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-studio-admin-debug-apk
          path: flutter_admin/build/app/outputs/flutter-apk/app-debug.apk
