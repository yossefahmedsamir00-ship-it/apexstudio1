name: APEX FLOW ENGINE Checks

on:
  push:
    branches:
      - docs/apex-flow-engine-design
    paths:
      - 'apex/src/flow-engine/**'
      - 'apex/package.json'
      - 'apex/package-lock.json'
      - 'apex/tsconfig.json'
      - 'apex/vite.config.ts'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/functions/**'
      - '.github/workflows/apex-flow-engine-checks.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apex/src/flow-engine/**'
      - 'apex/package.json'
      - 'apex/package-lock.json'
      - 'apex/tsconfig.json'
      - 'apex/vite.config.ts'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/functions/**'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apex/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run focused Flow Engine contracts
        run: npm test -- src/flow-engine/domain.test.ts src/flow-engine/api.test.ts src/flow-engine/client.test.ts
      - name: Run complete web test suite
        run: npm test
      - name: Build all web entries
        run: npm run build


  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create minimal Supabase auth roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create schema auth;
          create table auth.users (id uuid primary key);
          SQL
      - name: Apply Flow Engine migration to disposable PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261031120000_apex_flow_engine_core.sql
      - name: Verify Flow Engine RLS and privilege boundaries
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/flow_engine_security.sql

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test server request contracts
        run: deno test --no-lock --allow-env supabase/functions/_shared/flow-engine-contracts.test.ts
      - name: Type-check Flow Engine Edge Functions
        run: >-
          deno check --no-lock
          supabase/functions/flow-engine-request/index.ts
          supabase/functions/flow-engine-operation/index.ts
          supabase/functions/flow-engine-approval/index.ts
          supabase/functions/flow-engine-finance/index.ts
