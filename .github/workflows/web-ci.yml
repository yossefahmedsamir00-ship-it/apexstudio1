name: Website CI

on:
  pull_request:
    paths:
      - 'apex/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apex/**'
      - '.github/workflows/web-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apex
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apex/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
