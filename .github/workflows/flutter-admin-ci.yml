name: Flutter Admin CI

on:
  pull_request:
    paths:
      - "flutter_admin/**"
      - ".github/workflows/flutter-admin-ci.yml"
  push:
    branches: [main]
    paths:
      - "flutter_admin/**"
      - ".github/workflows/flutter-admin-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_admin
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build web
        run: flutter build web --release
