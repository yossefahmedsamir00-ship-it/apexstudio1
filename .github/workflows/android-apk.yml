name: Build APEX STUDIO Android APK

on:
  workflow_dispatch:
  push:
    branches: [feat/apex-studio-flow-integration]
    paths:
      - 'apex/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Generate Android platform files when absent
        working-directory: apex
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name apex_studio .
          fi

      - name: Get dependencies
        working-directory: apex
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apex
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apex
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        working-directory: apex
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-studio-android-apk
          path: apex/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
