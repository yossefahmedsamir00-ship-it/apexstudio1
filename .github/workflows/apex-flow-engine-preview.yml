name: APEX FLOW ENGINE Local Preview

on:
  push:
    branches:
      - docs/apex-flow-engine-design
    paths:
      - 'apex/flow-engine.html'
      - 'apex/src/flow-engine/**'
      - 'apex/src/lib/admin-supabase.ts'
      - 'apex/vite.config.ts'
      - 'apex/package.json'
      - 'apex/package-lock.json'
      - '.github/workflows/apex-flow-engine-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://dyoaiszrmfrdxgouzgzq.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_VD3iKy4zbt4pJFfZkO4YFA_rj5sS1Ui
    steps:
      - name: Checkout isolated Flow Engine branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apex/package-lock.json

      - name: Install locked dependencies
        working-directory: apex
        run: npm ci

      - name: Verify web tests and production build
        working-directory: apex
        run: |
          npm test
          npm run build

      - name: Prepare localhost preview package
        shell: bash
        run: |
          mkdir -p preview/apexstudio1
          cp -R apex/dist/. preview/apexstudio1/
          cat > preview/README.txt <<'EOF'
          APEX FLOW ENGINE — LOCAL PREVIEW

          1. Extract this ZIP to a folder on your Windows computer.
          2. Double-click start-preview.bat.
          3. Your browser opens:
             http://localhost:4173/apexstudio1/flow-engine.html
          4. Sign in using the existing APEX owner account.

          The preview connects to the existing APEX Supabase project.
          Keep the preview server window open while using the page.
          Press Ctrl+C in that window to stop the local preview server.

          This package is a local UI preview. It does not publish the public
          APEX website or change the Flutter APK installed on your phone.
          EOF
          cat > preview/start-preview.bat <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          where py >nul 2>nul
          if %errorlevel%==0 (
            start "" http://localhost:4173/apexstudio1/flow-engine.html
            py -3 -m http.server 4173
            goto :end
          )
          where python >nul 2>nul
          if %errorlevel%==0 (
            start "" http://localhost:4173/apexstudio1/flow-engine.html
            python -m http.server 4173
            goto :end
          )
          echo Python is not installed or not available in PATH.
          echo Install Python 3, then run this file again.
          pause
          :end
          endlocal
          EOF

      - name: Upload local preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: apex-flow-engine-local-preview
          path: preview/
          if-no-files-found: error
          retention-days: 7
