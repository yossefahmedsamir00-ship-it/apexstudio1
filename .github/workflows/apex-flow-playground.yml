name: APEX FLOW Playground Build
on:
  push:
    branches: [docs/apex-flow-engine-design]
    paths:
      - "apex/flow-engine.html"
      - "apex/vite.config.ts"
      - "apex/package.json"
      - "apex/package-lock.json"
      - ".github/workflows/apex-flow-playground.yml"
  pull_request:
    paths:
      - "apex/flow-engine.html"
      - "apex/vite.config.ts"
      - "apex/package.json"
      - "apex/package-lock.json"
      - ".github/workflows/apex-flow-playground.yml"
permissions:
  contents: read
jobs:
  build-playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apex/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify playground output
        run: test -s dist/flow-engine.html
