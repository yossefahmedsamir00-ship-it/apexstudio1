name: APEX FLOW ENGINE Flutter Checks

on:
  push:
    branches:
      - docs/apex-flow-engine-design
    paths:
      - 'flutter_admin/**'
      - '.github/workflows/apex-flow-engine-flutter-checks.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'flutter_admin/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_admin
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name apex_studio_admin --org com.apexstudio .
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-flow-engine-flutter-admin-debug
          path: flutter_admin/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
