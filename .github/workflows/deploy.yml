name: Deploy APEX STUDIO to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_AI_API_URL: https://dyoaiszrmfrdxgouzgzq.supabase.co/functions/v1/apex-ai-gateway
  VITE_SUPABASE_URL: https://dyoaiszrmfrdxgouzgzq.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_VD3iKy4zbt4pJFfZkO4YFA_rj5sS1Ui

jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: apex
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Commit resolved lockfile once (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ ! -s apex/package-lock.json ]; then
            echo "::error::npm did not create apex/package-lock.json; refusing to deploy without a lockfile."
            exit 1
          fi
          if git ls-files --error-unmatch apex/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile is already tracked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex/package-lock.json
          git commit -m "Add reproducible npm lockfile"
          git push origin HEAD:main

      - name: Dependency security audit (report-only)
        working-directory: apex
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.RUNNER_TEMP + '/npm-audit.json';
          let report;
          try {
            report = JSON.parse(fs.readFileSync(path, 'utf8'));
          } catch {
            console.log('npm audit report was unavailable; dependency audit is NOT VERIFIED in this run.');
            process.exit(0);
          }
          const summary = report.metadata?.vulnerabilities ?? {};
          console.log('Dependency audit (report only):', JSON.stringify(summary));
          for (const [name, vuln] of Object.entries(report.vulnerabilities ?? {})) {
            const fix = typeof vuln.fixAvailable === 'object'
              ? JSON.stringify(vuln.fixAvailable)
              : String(vuln.fixAvailable);
            console.log(`[${vuln.severity}] ${name} | direct=${vuln.isDirect} | range=${vuln.range} | fixAvailable=${fix}`);
            for (const item of vuln.via ?? []) {
              if (typeof item === 'object') console.log(`  - ${item.title ?? item.name ?? 'Advisory'} ${item.url ?? ''}`);
            }
          }
          NODE

      - name: Preserve resolved lockfile and audit report
        if: always()
        working-directory: apex
        shell: bash
        run: |
          mkdir -p ci-artifacts
          if [ -f package-lock.json ]; then cp package-lock.json ci-artifacts/package-lock.json; fi
          if [ -f "$RUNNER_TEMP/npm-audit.json" ]; then cp "$RUNNER_TEMP/npm-audit.json" ci-artifacts/npm-audit.json; fi

      - name: Upload dependency audit artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: apex-dependency-audit-${{ github.run_number }}
          path: apex/ci-artifacts/
          if-no-files-found: warn
          retention-days: 3

      - name: Run tests
        working-directory: apex
        run: npm test

      - name: Build project
        working-directory: apex
        run: npm run build

      - name: Persist dependency lockfile after successful verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex/package-lock.json
          if git diff --cached --quiet; then
            echo "Package lockfile is already current."
          else
            git commit -m "chore(deps): add verified package lockfile"
            git push origin HEAD:main
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apex/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
