name: Deploy APEX STUDIO static HTML CSS JS website to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apex/package-lock.json

      - name: Install website dependencies
        working-directory: apex
        run: npm ci

      - name: Run website tests
        working-directory: apex
        run: npm test

      - name: Build HTML, CSS and JavaScript website
        working-directory: apex
        run: npx vite build --config vite.vanilla.config.ts

      - name: Include ANSTA storefront page
        run: cp task.html apex/build/web/task.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apex/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
